name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: fundsroom_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Build Backend (TypeScript Compilation)
        run: cd backend && npm run build

      - name: Run Database Migrations & Seed for CI Test DB
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/fundsroom_crm_test?sslmode=disable
          JWT_SECRET: super-secret-ci-test-key-min-32-chars
        run: cd backend && npx prisma migrate deploy && npx prisma db seed

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/fundsroom_crm_test?sslmode=disable
          JWT_SECRET: super-secret-ci-test-key-min-32-chars
        run: cd backend && npm run test

  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend (Vite & TypeScript)
        run: cd frontend && npm run build

      - name: Run Frontend Tests
        run: cd frontend && npm run test
